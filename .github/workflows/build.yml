name: Build Go Sample Projects

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 'stable' on purpose, and deliberately NOT the pinned version used
          # by golangci-lint.yml. Building on the current Go is this job's
          # whole point: it is the signal that these samples still compile
          # against the latest release. The lint job pins instead, because a
          # linter has to understand the compiler's export-data format and a
          # floating toolchain there silently outruns it. Every sample's
          # go.mod is <= the lint pin, so the lint toolchain can still build
          # all of them.
          go-version: 'stable'

      - name: Build projects
        run: |
          #!/bin/bash
          cd /home/runner/work/samples-go/samples-go

          for dir in */; do
            dir_name="${dir%/}"
            if [ -d "$dir" ] && [ -f "${dir}go.mod" ]; then
              echo "Building project in $dir"

              # Change to the project directory
              cd "$dir" || continue

              # Fetch what the build needs first, retried: proxy.golang.org
              # now and then resets a download mid-transfer, and one reset
              # would fail this whole job. `go list -deps` loads exactly the
              # packages `go build` does, so it fetches nothing more.
              n=0
              until go list -deps ./... >/dev/null; do
                n=$((n+1))
                if [ "$n" -ge 5 ]; then
                  echo "go list -deps failed in $dir after $n attempts" >&2
                  exit 1
                fi
                echo "go list -deps failed in $dir (attempt $n), retrying in $((n*5))s"
                sleep $((n*5))
              done

              # Build the project (supports modules with multiple commands under ./cmd/*)
              if go build ./...; then
                echo "Successfully built $dir"
              else
                echo "Failed to build $dir" >&2
                exit 1
              fi

              # Return to the base directory
              cd ..
            else
              echo "Skipping $dir, no go.mod file found."
            fi
          done

          echo "All projects processed."
