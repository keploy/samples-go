# Aerospike CE config — clear-text only on port 3000 inside the docker
# network. TLS is terminated by stunnel sitting in front of this service
# (see docker-compose.yml + stunnel/stunnel.conf). From the app and the
# Keploy proxy's perspective the wire is TLS on 3001 either way.

service {
    proto-fd-max 15000
    cluster-name aerospike-tls-sample
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }

    heartbeat {
        mode mesh
        address local
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        address local
        port 3001
    }

    info {
        port 3003
    }
}

namespace test {
    replication-factor 1
    default-ttl 0
    storage-engine memory {
        data-size 1G
    }
}
