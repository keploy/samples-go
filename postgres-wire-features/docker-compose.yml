services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Force trust auth (code 0). Postgres 16 defaults to scram-sha-256
      # (code 10), which this sample's raw-v3 client does not speak — we
      # only implement code 0 / 3 / 5. This keeps auth on a path the
      # sample can actually complete so the downstream Postgres wire
      # surface (CopyData, cursors, PREPARE/EXECUTE, etc.) is what the
      # record/replay cycle is actually exercising. With trust auth the
      # server never requests a password, so POSTGRES_PASSWORD/PGPASSWORD
      # are intentionally omitted to avoid implying otherwise.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Bind to loopback only so the trust-auth Postgres isn't reachable
      # from other hosts on the developer's network.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is load-bearing: it forces a TCP probe.
      #
      # Without it pg_isready talks to the Unix socket, and postgres'
      # docker-entrypoint runs a *temporary* server reachable only over that
      # socket (listen_addresses='') once initdb has finished, to create the
      # database and run docker-entrypoint-initdb.d. The socket therefore
      # answers "accepting connections" while no TCP listener exists at all,
      # so compose marks this service healthy and depends_on:
      # service_healthy releases the dependent straight into ECONNREFUSED.
      #
      # Short but real: ~235ms with no initdb.d scripts, and 1.2s of
      # false-healthy plus a 2.7s shutdown checkpoint in the CI failure this
      # was diagnosed from. Only bites on a fresh volume -- a populated one
      # skips the temporary server entirely, which is why it failed rarely.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
